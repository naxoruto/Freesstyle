services:
  postgres:
    image: postgres:16-alpine
    container_name: freestyle-db
    restart: always
    environment:
      POSTGRES_USER: freestyle
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD para produccion}
      POSTGRES_DB: freestyle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freestyle -d freestyle"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - freestyle

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: freestyle-server
    restart: always
    environment:
      DATABASE_URL: postgresql://freestyle:${DB_PASSWORD:?Define DB_PASSWORD para produccion}@postgres:5432/freestyle
      WS_PORT: 3001
      NODE_ENV: production
      TRUST_PROXY: "1"
      INVENTORY_ADMIN_TOKEN: ${INVENTORY_ADMIN_TOKEN:?Define INVENTORY_ADMIN_TOKEN para produccion}
      SESSION_HASH_SALT: ${SESSION_HASH_SALT:?Define SESSION_HASH_SALT para produccion}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Define ALLOWED_ORIGINS para produccion}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - freestyle

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ""
    container_name: freestyle-web
    restart: always
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    networks:
      - freestyle

  nginx:
    image: nginx:alpine
    container_name: freestyle-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - server
    networks:
      - freestyle

volumes:
  pgdata:

networks:
  freestyle:
