version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: freestyle-db
    restart: always
    environment:
      POSTGRES_USER: freestyle
      POSTGRES_PASSWORD: ${DB_PASSWORD:-freestyle123}
      POSTGRES_DB: freestyle
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - freestyle

  redis:
    image: redis:7-alpine
    container_name: freestyle-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - freestyle

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: freestyle-server
    restart: always
    environment:
      DATABASE_URL: postgresql://freestyle:${DB_PASSWORD:-freestyle123}@postgres:5432/freestyle
      REDIS_URL: redis://redis:6379
      WS_PORT: 3001
    depends_on:
      - postgres
      - redis
    networks:
      - freestyle

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: freestyle-web
    restart: always
    environment:
      NEXT_PUBLIC_WS_URL: ${WS_URL:-https://TU_DOMINIO.com/ws}
    networks:
      - freestyle

  nginx:
    image: nginx:alpine
    container_name: freestyle-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - server
    networks:
      - freestyle

volumes:
  pgdata:

networks:
  freestyle:
