events {}

http {
    include /etc/nginx/mime.types;

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name TU_DOMINIO.com www.TU_DOMINIO.com;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS (comment out until SSL is set up)
        # return 301 https://$host$request_uri;

        # Frontend
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket backend
        location /ws/ {
            rewrite ^/ws/(.*) /$1 break;
            proxy_pass http://server:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # API backend
        location /api/ {
            proxy_pass http://server:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # HTTPS server (uncomment after certbot)
    # server {
    #     listen 443 ssl;
    #     server_name TU_DOMINIO.com www.TU_DOMINIO.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/TU_DOMINIO.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.com/privkey.pem;
    #
    #     location / {
    #         proxy_pass http://web:3000;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection $connection_upgrade;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location /ws/ {
    #         rewrite ^/ws/(.*) /$1 break;
    #         proxy_pass http://server:3001;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
